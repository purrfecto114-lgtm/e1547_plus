# 2G is what the AGP 8 + Kotlin 2 build actually peaks at; the previous 8G
# heap with a 4G metaspace cap tipped 4-8G machines into the OOM killer
# without leaving any error behind.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
