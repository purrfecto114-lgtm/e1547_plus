name: monitor-ios-226

# The independent watchdog for the one shot ios retry: ten minutes
# behind retry-ios-226 it starts watching the release run and keeps
# watching until the missing IPA has landed on the 22.5.0+226 release
# or its own budget runs out. If the rerun loop of the retry workflow
# ever stalls, the watchdog triggers the rerun itself, so one dead
# workflow cannot leave the release without its IPA. Whatever happens,
# the verdict goes into the run summary and the workflow deletes
# itself afterwards, keeping it a one shot affair.

on:
  schedule:
    - cron: '40 4 20 11 *' # 2026-11-20 04:40 UTC, ten minutes behind the retry
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: watch the rerun until the ipa lands or the budget runs out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: 44555609802
        run: |
          deadline=$(( $(date +%s) + 330 * 60 ))
          stalls=0
          verdict=exhausted
          while [ "$(date +%s)" -lt "$deadline" ]; do
            read -r status conclusion <<< "$(gh run view $RUN_ID \
              --repo purrfecto114-lgtm/e1547_plus \
              --json status,conclusion \
              --jq '"\(.status) \(.conclusion // "-")"')"
            release=$(gh api \
              repos/purrfecto114-lgtm/e1547_plus/releases/tags/22.5.0%2B226 \
              2>/dev/null) || release='{"assets":[]}'
            names=$(echo "$release" | jq -r '[.assets[].name] | join(" ")')
            count=$(echo "$release" | jq '.assets | length')
            ipa=$(echo "$release" | jq 'any(.assets[].name; . == "e1547.ipa")')
            echo "$(date -u +%H:%M) run=$status/$conclusion assets=$count ipa=$ipa"
            if [ "$ipa" = true ] && [ "$count" -ge 7 ]; then
              verdict=published
              break
            fi
            if [ "$status" = completed ] && [ "$conclusion" != success ]; then
              # Two consecutive polls on a finished failed run mean the
              # retry workflow lost its grip; nudge the run ourselves.
              stalls=$(( stalls + 1 ))
              if [ "$stalls" -ge 2 ]; then
                echo "run stalled twice, watchdog triggers the rerun"
                gh run rerun $RUN_ID \
                  --repo purrfecto114-lgtm/e1547_plus --failed \
                  && echo rerun triggered || echo rerun rejected, kept polling
                stalls=0
              fi
            else
              stalls=0
            fi
            sleep 540
          done
          if [ "$verdict" = published ]; then
            echo "22.5.0+226 now carries 7 assets including e1547.ipa" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "monitor budget exhausted without the ipa:"
              echo "run 44555609802 last seen \`$status/$conclusion\`,"
              echo "release 22.5.0+226 has $count assets ($names)."
              echo "The macOS window stayed closed; rerun retry-ios-226"
              echo "or \`gh run rerun 44555609802 --failed\` later."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::the ipa never landed inside the monitor budget"
            exit 1
          fi

      - name: double check the release state before cleanup
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release=$(gh api \
            repos/purrfecto114-lgtm/e1547_plus/releases/tags/22.5.0%2B226)
          target=$(echo "$release" | jq -r '.target_commitish')
          echo "$release" | jq -r '.assets[] | "\(.name) \(.size)"'
          case "$target" in 0398b7ef*) ;; *) echo "tag moved to $target"; exit 1;; esac

      - name: remove this watchdog workflow
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: commit the removal
        if: ${{ always() }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin master
          git rm .github/workflows/monitor-ios-226.yml
          git commit -m "removed the one shot ios watchdog workflow"
          git push
