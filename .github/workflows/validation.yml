name: Application Validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: setup actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: get flutter dependencies
        run: flutter pub get --enforce-lockfile

      # The generated localizations are committed; regenerate them here so a
      # stale checkout (arb edits without a regeneration commit) fails
      # instead of shipping an interface that disagrees with its arbs.
      - name: verify localization freshness
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n

      - name: verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: analyze sources
        run: flutter analyze

      - name: run tests
        run: flutter test

      # Scans the locked Ruby and Pub dependencies against OSV; advisories
      # outside tool/osv_baseline.txt (known-unfixable under the current
      # fastlane constraints) fail the validation.
      - name: scan locked dependencies against OSV
        run: ./tool/osv_scan.sh

  android-smoke:
    # Catches gradle level breakage that the dart level jobs cannot see,
    # such as AGP splits, manifest merges or native plugin changes.
    runs-on: ubuntu-latest
    steps:
      - name: setup actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: get flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: build debug APK
        run: flutter build apk --debug
