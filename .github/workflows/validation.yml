name: Application Validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: setup actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: get flutter dependencies
        run: flutter pub get --enforce-lockfile

      # The generated localizations are committed; regenerate them here so a
      # stale checkout (arb edits without a regeneration commit) fails
      # instead of shipping an interface that disagrees with its arbs.
      # gen-l10n only prints untranslated messages as a warning, so the key
      # sets are compared separately.
      - name: verify localization freshness
        run: |
          python3 tool/check_translations.py
          flutter gen-l10n
          git diff --exit-code lib/l10n

      - name: verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: analyze sources
        run: flutter analyze

      # Scans the locked Ruby and Pub dependencies against OSV; advisories
      # outside tool/osv_baseline.txt (known-unfixable under the current
      # fastlane constraints) fail the validation. The scan batched its
      # queries: a per-package round trip cost about a minute, the batch
      # endpoint answers all ~350 locked packages in a few requests.
      - name: scan locked dependencies against OSV
        run: ./tool/osv_scan.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish: each one reports its own failing suites
      # as check annotations, and cutting the others loose would hide
      # whether the same regression broke them too.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: setup actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: get flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: run tests
        # Sharded over the sorted test files: every job compiles and runs
        # only its own third of the suite. The runner's built-in
        # --total-shards was measured worse than no sharding at all — it
        # filters tests only after loading, so every shard still compiles
        # all ~176 files before dropping two thirds of them.
        run: |
          files=$(find test -name "*_test.dart" | LC_ALL=C sort | awk -v shard=${{ matrix.shard }} 'NR % 3 == shard')
          flutter test $files --reporter github

  android-smoke:
    # Catches gradle level breakage that the dart level jobs cannot see,
    # such as AGP splits, manifest merges or native plugin changes.
    runs-on: ubuntu-latest
    steps:
      - name: setup actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: setup gradle cache
        # The gradle wrapper, plugin and dependency caches live outside
        # the flutter SDK cache; without this step every run redownloads
        # them and the smoke build spends most of its five minutes there.
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          dependency-graph: disable

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: get flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: build debug APK
        run: flutter build apk --debug
