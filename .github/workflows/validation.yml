name: Application Validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  # github.workflow resolves to the caller's workflow name on
  # workflow_call, so a release dispatch's validation ("Application
  # Release") never shares a group with a plain push's ("Application
  # Validation"): a master push can no longer cancel the validation a
  # release is waiting on, and the release still cancels its own stale
  # dispatches.
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: setup actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: cache pub dependencies
        # The flutter SDK cache covers the engine, not the ~350 locked
        # packages: without this every job redownloads them over the
        # network on each run.
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: get flutter dependencies
        run: flutter pub get --enforce-lockfile

      # The generated localizations are committed; regenerate them here so a
      # stale checkout (arb edits without a regeneration commit) fails
      # instead of shipping an interface that disagrees with its arbs.
      # gen-l10n only prints untranslated messages as a warning, so the key
      # sets are compared separately.
      - name: verify localization freshness
        run: |
          python3 tool/check_translations.py
          flutter gen-l10n
          git diff --exit-code lib/l10n

      - name: verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: analyze sources
        run: flutter analyze

      # Scans the locked Ruby and Pub dependencies against OSV; advisories
      # outside tool/osv_baseline.txt (known-unfixable under the current
      # fastlane constraints) fail the validation. The scan batched its
      # queries: a per-package round trip cost about a minute, the batch
      # endpoint answers all ~350 locked packages in a few requests.
      - name: scan locked dependencies against OSV
        run: ./tool/osv_scan.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Let every shard finish: each one reports its own failing suites
      # as check annotations, and cutting the others loose would hide
      # whether the same regression broke them too.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: setup actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: cache pub dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: get flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: run tests
        # Sharded by weight (line count), not position: greedy longest-first
        # bin packing keeps the three shards within a fraction of a percent
        # of each other, where the old round-robin put 27% more lines on
        # shard 0 than on shard 2 — and the slowest timing suites live in
        # that heaviest shard. The assignment depends only on the checked-
        # out tree, so all three shards agree without coordination.
        # A first-attempt failure retries once, loudly: a one-off timing
        # flake stops failing whole release dispatches, while a real
        # regression still fails the job on its second run.
        run: |
          files=$(find test -name "*_test.dart" | LC_ALL=C sort \
            | xargs wc -l | sed '$d' | sort -rn \
            | awk -v shard=${{ matrix.shard }} '
              { w[NR] = $1; $1 = ""; sub(/^ /, ""); f[NR] = $0 }
              END {
                s[0] = s[1] = s[2] = 0
                for (i = 1; i <= NR; i++) {
                  m = 0
                  if (s[1] < s[m]) m = 1
                  if (s[2] < s[m]) m = 2
                  s[m] += w[i]
                  if (m == shard) print f[i]
                }
              }')
          if ! flutter test $files --reporter github; then
            echo "::warning title=Possible flake::test shard ${{ matrix.shard }} failed once; retrying once"
            flutter test $files --reporter github
          fi

  android-smoke:
    # Catches gradle level breakage that the dart level jobs cannot see,
    # such as AGP splits, manifest merges or native plugin changes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: setup actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: setup gradle cache
        # The gradle wrapper, plugin and dependency caches live outside
        # the flutter SDK cache; without this step every run redownloads
        # them and the smoke build spends most of its five minutes there.
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          dependency-graph: disabled

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: cache pub dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: get flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: build debug APK
        run: flutter build apk --debug
